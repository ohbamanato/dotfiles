onboarding = false
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[theme]
name = "tokyo-night"
auto_switch = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[experimental]
switch_ascii_input_source_in_prefix = false

[keys]
prefix = "ctrl+p"
detach = "ctrl+o"

# Panes
split_vertical = "prefix+r"
split_horizontal = "prefix+d"
last_pane = "prefix+u"
resize_mode = "prefix+m"          # moved from prefix+r (conflicts with split_vertical)
copy_mode = "prefix+["            # scroll/select output with the keyboard (like WezTerm prefix+[)

# Tabs (prefix+1..9 jumps directly). prefix+e / prefix+q are used by WezTerm tabs.
new_tab = "prefix+n"
next_tab = "ctrl+tab"
previous_tab = "ctrl+shift+tab"

# Workspaces (projects)
next_workspace = "prefix+shift+l"
previous_workspace = "prefix+shift+h"
switch_workspace = "prefix+shift+1..9"

# Agents
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"
